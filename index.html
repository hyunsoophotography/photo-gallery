<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYUNSOO PHOTOGRAPHY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}

header{
    width:100%;
    padding:60px 40px;
    position:fixed;
    top:0;
    left:0;
    z-index:100;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
}

header h1{
    font-size:32px;
    letter-spacing:8px;
    font-weight:300;
}

.hero{
    height:100vh;
    background:url('N72_0215_web.jpg') center center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-content h2{
    font-size:72px;
    font-weight:300;
    letter-spacing:12px;
}

.hero-content p{
    margin-top:20px;
    font-size:20px;
    letter-spacing:4px;
    color:#ccc;
}

.gallery{
    padding:120px 30px;
    columns:3 320px;
    column-gap:18px;
}

.gallery img{
    width:100%;
    margin-bottom:18px;
    border-radius:2px;
    cursor:pointer;
    transition:0.5s;
    filter:grayscale(100%);
}

.gallery img:hover{
    transform:scale(1.02);
    opacity:0.92;
    filter:grayscale(0%);
}

.about{
    padding:140px 40px;
    max-width:900px;
    margin:auto;
    text-align:center;
}

.about h3{
    font-size:48px;
    margin-bottom:40px;
    font-weight:300;
    letter-spacing:6px;
}

.about p{
    color:#aaa;
    line-height:2;
    font-size:20px;
}

footer{
    text-align:center;
    padding:80px 20px;
    color:#666;
    letter-spacing:3px;
    font-size:14px;
}

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:92%;
    max-height:92%;
}

.lightbox.active{
    display:flex;
}

@media(max-width:768px){

    header{
        padding:30px 20px;
    }

    header h1{
        font-size:20px;
        letter-spacing:4px;
    }

    .hero-content h2{
        font-size:40px;
        letter-spacing:6px;
    }

    .hero-content p{
        font-size:16px;
    }

    .gallery{
        columns:1;
        padding:80px 15px;
    }

    .about{
        padding:80px 25px;
    }

    .about h3{
        font-size:32px;
    }

    .about p{
        font-size:18px;
    }

}

</style>
</head>

<body>

<header>
    <h1>HYUNSOO PHOTOGRAPHY</h1>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>MONOCHROME</h2>
        <p>Fine Art Photography</p>
    </div>
</section>

<section class="gallery">

<img src="N72_0215_web.jpg">
<img src="N72_0834_web.jpg">
<img src="N72_0875_web.jpg">
<img src="N72_0886_web.jpg">
<img src="N72_0971_web.jpg">
<img src="N72_1025_web.jpg">
<img src="N72_1041_web.jpg">
<img src="N72_1091_web.jpg">

</section>

<section class="about">
    <h3>ABOUT</h3>
    <p>
    Exploring silence, shadow, and emotion through monochrome imagery.
    A visual journey through fine art black and white photography.
    </p>
</section>

<footer>
    <p>© 2026 HYUNSOO PHOTOGRAPHY</p>
    <p>
        Contact :
        <a href="mailto:lighteller@naver.com">
            lighteller@naver.com
        </a>
    </p>
</footer>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
</div>

<script>

const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
    });
});

lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
});

</script>

</body>
</html>
