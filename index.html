<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYUNSOO PHOTOGRAPHY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<!-- 🌟 [추가] Font Awesome 아이콘 라이브러리 연결 -->
<link rel="stylesheet" href="https://cloudflare.com">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}

header{
    width:100%;
    padding:60px 40px;
    position:fixed;
    top:0;
    left:0;
    z-index:100;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
}

header h1{
    font-size:32px;
    letter-spacing:8px;
    font-weight:300;
}

.hero{
    height:100vh;
    background:url('N72_0215_web.jpg') center center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-content h2{
    font-size:72px;
    font-weight:300;
    letter-spacing:12px;
}

.hero-content p{
    margin-top:20px;
    font-size:20px;
    letter-spacing:4px;
    color:#ccc;
}

.gallery{
    padding:120px 30px;
    columns:3 320px;
    column-gap:18px;
}

.gallery img{
    width:100%;
    margin-bottom:18px;
    border-radius:2px;
    cursor:pointer;
    transition:0.5s;
    filter:grayscale(100%);
}

.gallery img:hover{
    transform:scale(1.02);
    opacity:0.92;
    filter:grayscale(0%);
}

.about{
    padding:140px 40px;
    max-width:900px;
    margin:auto;
    text-align:center;
}

.about h3{
    font-size:48px;
    margin-bottom:40px;
    font-weight:300;
    letter-spacing:6px;
}

.about p{
    color:#aaa;
    line-height:2;
    font-size:20px;
}

footer{
    text-align:center;
    padding:80px 20px;
    color:#666;
    letter-spacing:3px;
    font-size:14px;
}

/* 🌟 [추가] 이메일 링크 및 인스타그램 아이콘 스타일 정의 */
footer p {
    margin-bottom: 12px;
}

footer a {
    color: #666;
    text-decoration: none;
    transition: color 0.3s;
}

footer a:hover {
    color: #fff; /* 마우스 올리면 하얗게 강조 */
}

.instagram-icon {
    display: inline-block;
    font-size: 26px;      /* 아이콘 크기 */
    margin-top: 15px;     /* 위쪽 간격 */
    color: #666;          /* 사이트 톤에 맞춰 회색으로 설정 */
    transition: transform 0.3s, color 0.3s;
}

.instagram-icon:hover {
    color: #fff;          /* 마우스 올리면 하얗게 강조 */
    transform: scale(1.1); /* 마우스 올리면 살짝 커지는 효과 */
}

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:92%;
    max-height:92%;
}

.lightbox.active{
    display:flex;
}

@media(max-width:768px){

    header{
        padding:30px 20px;
    }

    header h1{
        font-size:20px;
        letter-spacing:4px;
    }

    .hero-content h2{
        font-size:40px;
        letter-spacing:6px;
    }

    .hero-content p{
        font-size:16px;
    }

    .gallery{
        columns:1;
        padding:80px 15px;
    }

    .about{
        padding:80px 25px;
    }

    .about h3{
        font-size:32px;
    }

    .about p{
        font-size:18px;
    }

}

/* 인스타그램 링크 전체 정렬 */
.instagram-link {
    display: inline-flex;      /* 이미지와 글자를 가로로 나란히 */
    align-items: center;       /* 이미지와 글자의 세로 중앙 위치를 완벽히 일치 */
    justify-content: center;
    color: #8c8c8c;            
    text-decoration: none;     
    font-size: 24px;           /* 글자 크기 */
}

/* 인스타그램 JPG 이미지 크기 대폭 축소 */
.instagram-img {
    width: 24px;               /* 텍스트 높이(24px)에 맞춰 크기를 줄였습니다 */
    height: 24px;              /* 가로 세로 정비율 유지 */
    margin-right: 8px;         /* 아이콘과 우측 텍스트 사이의 간격 */
    object-fit: contain;       /* 이미지 왜곡 방지 */
    display: inline-block;     
}


</style>
</head>

<body>

<header>
    <h1>HYUNSOO PHOTOGRAPHY</h1>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>MONOCHROME</h2>
        <p>Fine Art Photography</p>
    </div>
</section>

<section class="gallery">

<img src="N72_0215_web.jpg">
<img src="N72_0834_web.jpg">
<img src="N72_0875_web.jpg">
<img src="N72_0886_web.jpg">
<img src="N72_0971_web.jpg">
<img src="N72_1025_web.jpg">
<img src="N72_1492_web.jpg">
<img src="N72_1041_web.jpg">
<img src="N72_1091_web.jpg">

</section>

<section class="about">
    <h3>ABOUT</h3>
    <p>
    Exploring silence, shadow, and emotion through monochrome imagery.
    A visual journey through fine art black and white photography.
    </p>
</section>

<footer>
    <p>© 2026 HYUNSOO PHOTOGRAPHY</p>
    <p>
        Contact :
        <a href="mailto:lighteller@naver.com">
            lighteller@naver.com
        </a>
    </p>
    <!-- 🌟 [추가] 인스타그램 아이콘 링크 (아이디 부분을 수정하세요) -->
    <!-- 🌟 인스타그램 아이콘 링크 -->
<!-- 🌟 인스타그램 아이콘 링크 -->
<a href="https://instagram.com/hyunsoo.photography" target="_blank" rel="noopener noreferrer" class="instagram-link">
    <!-- 아이콘 JPG 이미지 삽입 (파일명과 경로를 본인 환경에 맞게 수정하세요) -->
    <img src="instagram_icon.png" alt="Instagram" class="instagram-img">
    <span class="instagram-id">hyunsoo.photography</span>
</a>


</footer>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
</div>

<script>

const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
    });
});

lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
});

</script>

<script>

  // 우클릭 방지
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 드래그 방지
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  });

  // 이미지 저장 단축키 일부 방지
  document.addEventListener('keydown', function(e) {

    // Ctrl+S
    if (e.ctrlKey && e.key === 's') {
      e.preventDefault();
    }

    // Ctrl+U (소스보기)
    if (e.ctrlKey && e.key === 'u') {
      e.preventDefault();
    }

    // F12 개발자도구
    if (e.key === 'F12') {
      e.preventDefault();
    }

  });

</script>

</body>
</html>
