<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyunsoo Photography</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
}

header{
    text-align:center;
    padding:60px 20px;
}

header h1{
    font-size:42px;
    font-weight:200;
    letter-spacing:4px;
}

.gallery{
    columns:3 300px;
    column-gap:15px;
    padding:20px;
}

.gallery img{
    width:100%;
    margin-bottom:15px;
    border-radius:4px;
    transition:0.4s;
    cursor:pointer;
}

.gallery img:hover{
    transform:scale(1.02);
    opacity:0.9;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
    font-size:14px;
}

@media(max-width:768px){
    header h1{
        font-size:28px;
    }
}

</style>
</head>
